<script>
'use strict';
const $=s=>document.querySelector(s),K='ldp2',te=new TextEncoder();

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const get=(l,i)=>DB[l].find(o=>o.id==i),nm=(l,i)=>get(l,i)?.name||'—',cn=i=>{const c=get('cases',i);return c?`${c.court} ${c.no}/${c.yr}`:'—'},N=n=>Math.round(+n||0).toLocaleString('en-US');
const blank=()=>({clients:[],cases:[],hearings:[],tasks:[],fees:[],pays:[],exps:[],docs:[],log:[],audit:[],inv:0,lastExp:'',firm:{name:'مكتب المحاماة',addr:'',phone:''}});
/* crypto: PBKDF2 key derived once, fresh IV per save */
const b64=a=>{let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const dk=async(p,s)=>crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:200000,hash:'SHA-256'},await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
const enc=async t=>{const iv=crypto.getRandomValues(new Uint8Array(12));return{s:b64(SALT),i:b64(iv),c:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,te.encode(t))))}};
const dec=async(b,k)=>new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(b.i)},k,ub(b.c)));
const save=async()=>{try{localStorage.setItem(K,JSON.stringify(await enc(JSON.stringify(DB))))}catch(e){toast('تعذر الحفظ',1)}};
const toast=(m,e)=>{const x=document.createElement('div');x.className='t '+(e===1?'e':'o');x.textContent=m;$('#ts').append(x);setTimeout(()=>x.remove(),3000)};
const ask=(t,body)=>new Promise(r=>{const b=document.createElement('div');b.className='mb';b.innerHTML=`<form class="md"><h3>${t}</h3>${body}<div class="ac"><button type="button" class="b s" data-n>إلغاء</button><button class="b">موافق</button></div></form>`;document.body.append(b);const f=b.firstChild;f.querySelector('input,textarea')?.focus();b.querySelector('[data-n]').onclick=()=>{b.remove();r(null)};f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));b.remove();r(d)}});
const show=(t,body)=>{const b=document.createElement('div');b.className='mb';b.innerHTML=`<div class="md"><h3>${t}</h3>${body}<div class="ac"><button class="b s" data-n>إغلاق</button></div></div>`;document.body.append(b);b.onclick=e=>{if(e.target===b||e.target.dataset.n!=null)b.remove()}};
const fld=(n,l,a='')=>`<label>${l}<input name="${n}" ${a}></label>`,sl=(n,l,p)=>`<label>${l}<select name="${n}">${p.map(([x,t])=>`<option value="${esc(x)}">${esc(t)}</option>`).join('')}</select></label>`;

async function unlock(e){e.preventDefault();const p=$('#pw').value;if(p.length<6)return toast('٦ أحرف على الأقل',1);$('#lb').disabled=true;const raw=localStorage.getItem(K);

$('#lb').disabled=false;$('#pw').value='';$('#lock').hidden=true;aud('دخول','فتح المنصة');go('dash');arm()}

function health(c){let s=100,n=[];if(c.adj){s-=c.adj*6;n.push(`تأجيل ${c.adj} مرة`)}
if(c.st=='متداولة'&&!DB.hearings.some(h=>h.cid==c.id&&!h.done)){s-=12;n.push('لا جلسة مقبلة')}
const od=DB.tasks.filter(t=>t.cid==c.id&&!t.done&&t.due&&dd(t.due)<0).length;if(od){s-=od*8;n.push(od+' مهمة متأخرة')}
const b=bal(c.id);if(!b.fee){s-=8;n.push('لا اتفاق أتعاب')}else if(b.due/b.fee>.5){s-=15;n.push('مستحقات تتجاوز ٥٠٪')}

if(c.adj>=4)n.push('احتمال تسوية/تغيير استراتيجية');s=Math.max(5,s);return{s,n,c:s>=75?'var(--ok)':s>=50?'var(--w)':'var(--r)'}}
const when=h=>{if(h.done)return'';const n=dd(h.date);return n<0?`<span class="late">متأخرة ${-n} يوم</span>`:n==0?'<span class="late">اليوم</span>':n<=2?`<span class="soon">بعد ${n} يوم</span>`:`<span class="m">بعد ${n} يوم</span>`};

const hform=cid=>`<form class="g" onsubmit="return S(event,'hear')">${cid?`<input type="hidden" name="cid" value="${cid}">`:sl('cid','القضية',DB.cases.map(c=>[c.id,cn(c.id)]))}${fld('date','التاريخ','type=date required')}${fld('time','الوقت','type=time')}${fld('type','النوع','value=مرافعة required')}<button class="b">إضافة جلسة</button></form>`;
/* deadlines (Egypt) */

/* templates */
const T={dawa:['صحيفة دعوى','محكمة {court}\nالدائرة: {circ}\nصحيفة دعوى رقم {no} لسنة {yr}\n\nإنه في يوم ...... الموافق {date}\nبناءً على طلب السيد/ {client} ومحله المختار مكتب الأستاذ/ ...... المحامي\nأنا ...... محضر المحكمة قد انتقلت وأعلنت:\nالسيد/ {opp}\n\nالوقائع\n{subj}\n\nالسند القانوني\n......\n\nالطلبات\nيلتمس المدعي الحكم له بـ ...... مع إلزام المدعى عليه بالمصروفات وأتعاب المحاماة.\n\nوكيل المدعي'],
inzar:['إنذار على يد محضر','إنذار على يد محضر\nإنه في يوم ...... الموافق {date}\nبناءً على طلب السيد/ {client} المقيم في {addr}\nأنا ...... محضر قد انتقلت وأعلنت: السيد/ {opp}\n\nوأنذرته بما يلي\n{subj}\n\nوعليه ينذركم المنذر بضرورة الوفاء خلال ...... من تاريخ هذا الإنذار وإلا اتخذ الإجراءات القانونية مع حفظ كافة حقوقه.\n\nلأجل العلم'],

/* actions */
const A={
async client(d){const n=norm(d.name);if(DB.clients.some(c=>norm(c.name)==n||(d.nid&&c.nid==d.nid)))return toast('موكل مكرر',1);

<div class="box"><h2>إضافة جلسة</h2>${DB.cases.length?hform():'<p class="m">أضف قضية أولًا.</p>'}</div><div class="box"><h2>كل الجلسات القادمة</h2>${ht(DB.hearings.filter(h=>!h.done).sort((a,b)=>a.date.localeCompare(b.date)))}</div>`},
fin(){const fee=DB.fees.reduce((a,f)=>a+f.amt,0),paid=DB.pays.reduce((a,p)=>a+p.amt,0),ex=DB.exps.reduce((a,e)=>a+e.amt,0),rows=DB.cases.map(c=>({c,b:bal(c.id)})).filter(r=>r.b.due>0).sort((a,b)=>b.b.due-a.b.due);
return`<div class="st"><div class="sc"><b>${N(fee)}</b><span>إجمالي الأتعاب</span></div><div class="sc"><b style="color:var(--ok)">${N(paid)}</b><span>المحصّل</span></div><div class="sc"><b style="color:var(--r)">${N(fee-paid)}</b><span>المستحق</span></div><div class="sc"><b>${N(ex)}</b><span>مصروفات قضائية</span></div></div>
<div class="box"><h2>التحصيل الشهري</h2>${chart()}</div><div class="box"><h2>المتأخرات حسب القضية</h2><table>${rows.map(({c,b})=>`<tr><td><a class="k" onclick="go('cases','${c.id}')">${esc(cn(c.id))}</a><br><span class="m">${esc(nm('clients',c.cl))}</span></td><td>${N(b.paid)} / ${N(b.fee)}</td><td class="late">${N(b.due)}</td></tr>`).join('')||'<tr><td class="m">لا متأخرات 🎉</td></tr>'}</table></div>`},
tools(){const cs=DB.cases.map(c=>[c.id,cn(c.id)+' — '+nm('clients',c.cl)]);
return`<div class="box"><h2>حاسبة المواعيد القانونية</h2><form class="g" onsubmit="return S(event,'calc')">${sl('t','نوع الميعاد',DL.map((x,i)=>[i,x[0]]))}${fld('date','تاريخ صدور الحكم / الإعلان','type=date required')}<button class="b">احسب</button></form>
${LC?`<div class="al w" style="margin-top:10px">${esc(LC.txt)}</div>${cs.length?`<form class="g" onsubmit="return S(event,'lcTask')">${sl('cid','القضية',cs)}<button class="b gd">أضفه كمهمة</button></form>`:''}`:''}<p class="m">مرجع إرشادي: يُرحَّل الميعاد لأول يوم عمل عند مصادفته الجمعة/السبت. تحقق من النص القانوني والعطلات الرسمية وميعاد المسافة قبل الاعتماد.</p></div>
<div class="box"><h2>مولّد المستندات</h2>${cs.length?`<form class="g" onsubmit="return S(event,'gen')">${sl('cid','القضية',cs)}${sl('tpl','النموذج',Object.entries(T).map(([k,x])=>[k,x[0]]))}<button class="b">توليد</button></form>`:'<p class="m">أضف قضية أولًا.</p>'}</div>
${G?`<div class="box"><textarea class="doc" id="dt">${esc(G)}</textarea><p class="m">مسودة تنظيمية — راجع الصياغة والسند قبل الاعتماد.</p><button class="b" onclick="A.saveDoc()">💾 حفظ في ملف القضية</button> <button class="b s" onclick="$('#pr').style.whiteSpace='pre-wrap';$('#pr').textContent=$('#dt').value;print()">🖨 طباعة</button></div>`:''}`},
data(){const F=DB.firm;return`<div class="box"><h2>الأمان والنسخ الاحتياطي</h2><p class="m">قاعدة البيانات كاملة مشفّرة AES-256-GCM على هذا المتصفح، ولا تُرسَل لأي خادم. فقدان كلمة المرور = فقدان البيانات، وحذف بيانات المتصفح يمسحها؛ لذا احتفظ بنسخة مشفّرة دائمًا.</p><button class="b" onclick="A.expo()">⬇ نسخة مشفّرة</button> <button class="b s" onclick="A.imp()">⬆ استيراد ودمج</button> <button class="b s" onclick="A.demo()">بيانات تجريبية</button> <button class="b d" onclick="A.wipe()">حذف الكل</button></div>
<div class="box"><h2>ترويسة المكتب</h2><form class="g" onsubmit="return S(event,'firm')">${fld('name','اسم المكتب','value="'+esc(F.name)+'"')}${fld('addr','العنوان','value="'+esc(F.addr)+'"')}${fld('phone','الهاتف','value="'+esc(F.phone)+'"')}<button class="b">حفظ</button></form></div>
<div class="box"><h2>سجل التدقيق</h2><table>${DB.audit.slice(0,60).map(a=>`<tr><td class="m">${a.ts.slice(0,16).replace('T',' ')}</td><td><span class="chip">${esc(a.k)}</span></td><td>${esc(a.t)}</td></tr>`).join('')}</table></div>`}};
A.delC=async i=>{if(!await ask('حذف الموكل','<p>حذف نهائي؟</p>'))return;DB.clients=DB.clients.filter(c=>c.id!=i);sel=null;v='clients';done()};
const flt=(i,t)=>{const q=norm(i.value);document.querySelectorAll('#'+t+' tr').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')};
const mv=n=>{cm.setMonth(cm.getMonth()+n);render()};
const NAV=[['dash','الرئيسية'],['clients','الموكلون'],['cases','القضايا'],['cal','الجلسات'],['fin','المالية'],['tools','الأدوات'],['data','النظام']];
function go(x,i=null){v=x;sel=i;render();scrollTo(0,0)}
function render(){if(!DB)return;$('#nv').innerHTML=NAV.map(([k,t])=>`<button class="${k==v?'on':''}" onclick="go('${k}')">${t}</button>`).join('');$('#app').innerHTML=V[v]()}
function pal(){const b=document.createElement('div');b.className='mb';b.innerHTML='<div class="md"><input id="q" placeholder="ابحث في الموكلين والقضايا والمستندات…"><div id="qr" style="margin-top:10px"></div></div>';document.body.append(b);b.onclick=e=>{if(e.target===b)b.remove()};const q=b.querySelector('#q');q.focus();
q.oninput=()=>{if(!DB)return;const n=norm(q.value),r=[];if(n){DB.clients.forEach(c=>norm(c.name+c.phone).includes(n)&&r.push(['موكل',c.name,'clients',c.id]));DB.cases.forEach(c=>norm(cn(c.id)+c.opp+nm('clients',c.cl)+c.subj).includes(n)&&r.push(['قضية',cn(c.id),'cases',c.id]));DB.docs.forEach(d=>norm(d.title+d.text).includes(n)&&r.push(['مستند',d.title,'cases',d.cid]))}
b.querySelector('#qr').innerHTML=r.slice(0,12).map((x,i)=>`<div style="padding:6px 0;border-bottom:1px solid var(--l)"><span class="chip">${x[0]}</span> <a class="k" data-i="${i}">${esc(x[1])}</a></div>`).join('')||'<p class="m">لا نتائج.</p>';b.querySelectorAll('[data-i]').forEach(a=>a.onclick=()=>{const x=r[a.dataset.i];b.remove();go(x[2],x[3])})}}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();DB&&pal()}if(e.key=='Escape')document.querySelector('.mb')?.remove()});
lbl();
</script></body></html>
